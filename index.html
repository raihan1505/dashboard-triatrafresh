h1{font-size:16px;margin:0;letter-spacing:.02em;font-weight:600}
.cut{font-size:12px;color:var(--mu);border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tab{background:#0b0b0b;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:12px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.tab.on{background:#f1f0ee;color:#111}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card small{display:block;color:var(--mu);font-size:11px;margin-bottom:4px}
.card b{font-size:22px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card em{font-style:normal;color:var(--mu);font-size:11px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel h3{margin:0 0 10px;font-size:12px;font-weight:500;color:var(--mu)}
.scroll{max-height:372px;overflow:auto;scrollbar-width:thin;scrollbar-color:#333 transparent}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--mu);font-weight:400;text-align:left;font-size:11px;padding:0 0 6px;position:sticky;top:0;background:var(--card)}
td{padding:6px 0;border-top:1px solid #222}th.r,td.r{text-align:right}

.rk{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;font-size:11px;font-weight:700;color:#111}
.r1{background:#f3b66b}.r2{background:#c9c9c7}.r3{background:#e8896a}.rn{color:var(--mu);font-weight:400;background:none}
.bars{display:flex;flex-direction:column;gap:7px}
.b{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;font-size:11.5px}
.b span.l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk{background:var(--tr);border-radius:3px;height:13px;overflow:hidden}.fill{height:100%;background:var(--g);border-radius:3px}
.b span.v{text-align:right;font-weight:600}
.muted td{color:var(--mu)}
.search{width:100%;background:#0b0b0b;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 14px;font:13px inherit;font-family:inherit;margin-bottom:14px;outline:none}
.search:focus{border-color:#5f9f1c}.full{grid-column:1/-1}.hide{display:none}
td.m{color:#b9b9b4;font-size:11px;line-height:1.5;max-width:240px}tr.sel td{background:#1b2412}tr.team{cursor:pointer}

.empty{color:var(--mu);font-size:12px;padding:12px 0}
