const esc0=0;const bars=(items)=>{const mx=Math.max(...items.map(x=>x[1]),1);return items.map(([l,v,k])=>`<div class="b" ${k?`data-team="${esc(k)}"`:''}><span class="l" title="${l}">${l}</span><div class="trk"><div class="fill" style="width:${v/mx*100}%"></div></div><span class="v">${fmt(v)}</span></div>`).join('')};
let cur='walk',sel=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hit=(n,a,q)=>!q||(n+' '+a).toLowerCase().includes(q);
function render(t){
 cur=t;const q=$('q').value.trim().toLowerCase();
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 $('cut').textContent='Cut-off: '+D.cutoff;
 $('p3').classList.toggle('hide',t!=='kon');$('p1').classList.toggle('full',t==='kon');$('tbl').classList.toggle('tall',t==='kon');
 if(t==='kon'){
  $('ttl').textContent='TRIATRA FRESH 5.0 – KLASEMEN KONTINGEN';
  const all=D.teams.map(x=>({n:x[0],r:x[1],w:x[2],p:x[3],no:x[4],m:x[5],t:x[1]+x[2]}));
  const tm=all.filter(x=>!x.no).sort((a,b)=>b.t-a.t);
  const tot=all.reduce((s,x)=>s+x.t,0);
  if(sel&&!tm.find(x=>x.n===sel))sel=null;
  const mem=[];all.forEach(x=>x.m.forEach(m=>mem.push({n:m[0],a:m[1],k:x.no?'-':x.n,r:m[2],w:m[3],t:m[4]})));
  mem.sort((a,b)=>b.t-a.t);mem.forEach((m,i)=>m.i=i);
  $('cards').innerHTML=`<div class="card"><small>Jumlah tim</small><b>${tm.length}</b></div><div class="card"><small>Total km (Run + Walk)</small><b>${fmt(tot)}</b></div><div class="card"><small>Tim terdepan</small><b>${tm[0].n.replace('TEAM ','')}</b><em>${fmt(tm[0].t)} km</em></div>`;
  $('h1').textContent='Tabel klasemen kontingen'+(sel?' – '+sel+' (klik bar lagi untuk semua tim)':'');
  $('h2').textContent='Bar chart total km tim (klik untuk filter)';
  const rows=mem.filter(m=>(!sel||m.k===sel)&&hit(m.n,m.a+' '+m.k,q));
  $('tbl').innerHTML=rows.length?`<table><thead><tr><th>#</th><th>Nama</th><th>Area</th><th>Kontingen</th><th class="r">Run</th><th class="r">Walk</th><th class="r">Total</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${rk(m.i)}</td><td class="n">${esc(m.n)}</td><td class="a">${esc(m.a)}</td><td class="a">${esc(m.k)}</td><td class="r">${fmt(m.r)}</td><td class="r">${fmt(m.w)}</td><td class="r k">${fmt(m.t)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Tidak ada hasil.</div>';
  $('bars').innerHTML=bars(tm.map(x=>[x.n.replace('TEAM ',''),x.t,x.n]));
  $('h3').textContent='Top 10 anggota – '+(sel||'semua tim');
  $('bars3').innerHTML=bars(mem.filter(m=>!sel||m.k===sel).slice(0,10).map(m=>[m.n,m.t]));
  document.querySelectorAll('#bars .b').forEach(b=>{b.classList.toggle('on',b.dataset.team===sel);b.onclick=()=>{sel=sel===b.dataset.team?null:b.dataset.team;render('kon')}});
  return;}
 const L=D[t],W=t==='walk'?'WALK':'RUN';
 $('ttl').textContent='TRIATRA FRESH 5.0 – KLASEMEN '+W;
 const tot=L.reduce((s,x)=>s+x[2],0);
 $('cards').innerHTML=`<div class="card"><small>Peserta ${t}</small><b>${L.length}</b></div><div class="card"><small>Total ${t} (km)</small><b>${fmt(tot)}</b></div><div class="card"><small>${W[0]+W.slice(1).toLowerCase()} terjauh (km)</small><b>${fmt(L[0][2])}</b><em>${esc(L[0][0])}</em></div>`;
 $('h1').textContent='Tabel klasemen (semua peserta)';$('h2').textContent='Bar chart Top 10';
 const rows=L.map((x,i)=>[x,i]).filter(([x])=>hit(x[0],x[1],q));
 $('tbl').innerHTML=rows.length?`<table><thead><tr><th>#</th><th>Nama</th><th>Area</th><th class="r">KM</th></tr></thead><tbody>${rows.map(([x,i])=>`<tr><td>${rk(i)}</td><td class="n">${esc(x[0])}</td><td class="a">${esc(x[1])}</td><td class="r k">${fmt(x[2])}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Tidak ada hasil.</div>';
 $('bars').innerHTML=bars(L.slice(0,10).map(x=>[x[0],x[2]]));
}
$('q').oninput=()=>render(cur);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.t));
render('walk');
</script></body></html>
